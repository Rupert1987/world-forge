          model,
          version,
          source,
          status,
          width,
          height,
          encoding,
          depthUnit,
          valuesBase64,
          minDepth,
          maxDepth,
          focalLengthPx,
          normalsBase64,
          uncertaintyBase64,
          uncertaintyUnit,
          uncertaintyMean,
          checksumSha256,
          inputImageSha256,
        ]
      properties:
        provider:
          type: string
          enum: [depth-pro, depth-anything, metric3d, local-image-cues]
        model: { type: string }
        version: { type: string }
        source:
          type: string
          enum: [configured-http, local-onnx, local-fallback]
        status:
          type: string
          enum: [ready, fallback, failed]
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
        encoding:
          type: string
          enum: [float32-base64]
        depthUnit:
          type: string
          enum: [relative, meters]
        valuesBase64:
          type: ["string", "null"]
        minDepth:
          type: ["number", "null"]
        maxDepth:
          type: ["number", "null"]
        focalLengthPx:
          type: ["number", "null"]
        normalsBase64:
          type: ["string", "null"]
        uncertaintyBase64:
          type: ["string", "null"]
        uncertaintyUnit:
          type: ["string", "null"]
          enum: [relative, meters, null]
        uncertaintyMean:
          type: ["number", "null"]
        checksumSha256:
          type: ["string", "null"]
        inputImageSha256: { type: string }
        failureReason: { type: string }
    GeometryVerification:
      type: object
      required:
        [
          status,
          solver,
          solverVersion,
          canonicalImageSha256,
          requestedAlternateViewCount,
          verifiedAlternateViewCount,
          cameraPoseVerified,
          aggregateReprojectionRmsPixels,
          registrations,
          notes,
        ]
      properties:
        status:
          type: string
          enum:
            [
              not-requested,
              insufficient-verified-views,
              views-registered,
              solver-verified,
            ]
        solver:
          type: string
          enum: [opencv-orb-homography, configured-camera-solver]
        solverVersion: { type: string }
        canonicalImageSha256: { type: string }
        requestedAlternateViewCount: { type: number, minimum: 0 }
        verifiedAlternateViewCount: { type: number, minimum: 0 }
        cameraPoseVerified: { type: boolean }
        aggregateReprojectionRmsPixels:
          type: ["number", "null"]
          minimum: 0
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/ViewRegistration"
        notes:
          type: array
          items: { type: string }
    ViewRegistration:
      type: object
      required:
        [
          imageSha256,
          status,
          keypointCountCanonical,
          keypointCountAlternate,
          candidateMatchCount,
          inlierCount,
          inlierRatio,
          reprojectionRmsPixels,
          homography,
          reason,
        ]
      properties:
        imageSha256: { type: string }
        status:
          type: string
          enum: [registered, rejected, failed]
        keypointCountCanonical: { type: number, minimum: 0 }
        keypointCountAlternate: { type: number, minimum: 0 }
        candidateMatchCount: { type: number, minimum: 0 }
        inlierCount: { type: number, minimum: 0 }
        inlierRatio: { type: number, minimum: 0, maximum: 1 }
        reprojectionRmsPixels:
          type: ["number", "null"]
          minimum: 0
        homography:
          type: ["array", "null"]
          items: { type: number }
          minItems: 9
          maxItems: 9
        reason: { type: string }
    DepthMapSpec:
      type: object
      required: [status, provider, model, relativeOnly]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        provider: { type: string }
        model: { type: string }
        relativeOnly: { type: boolean }
        width: { type: number }
        height: { type: number }
        min: { type: number }
        max: { type: number }
        mean: { type: number }
        inferenceMilliseconds: { type: number }
        sourceImageSha256: { type: string }
        previewUrl: { type: string }
        error: { type: string }
    VisualSurvey:
      type: object
      required:
        [
          version,
          cameraHypothesis,
          depthBands,
          objects,
          terrainContours,
          waterlines,
          lightAndAtmosphere,
          ambiguities,
          coverageChecklist,
        ]
      properties:
        version: { type: number, enum: [1] }
        cameraHypothesis:
          $ref: "#/components/schemas/SurveyCameraHypothesis"
        depthBands:
          type: array
