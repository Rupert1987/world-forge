        transforms:
          type: array
          items: { $ref: "#/components/schemas/UnrealInstance" }
    UnrealScene:
      type: object
      required: [version, format, units, coordinateSystem, landscape, splines, proxyActors, hierarchicalInstances]
      properties:
        version: { type: number, minimum: 1 }
        format: { type: string }
