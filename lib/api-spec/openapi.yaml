          type: object
          required: [source, target, metersToUnrealCentimeters, conversionRule]
          properties:
            source: { type: string, enum: [meters] }
            target: { type: string, enum: [centimeters] }
            metersToUnrealCentimeters: { type: number, const: 100 }
            conversionRule: { type: string }
        coordinateSystem:
          type: object
          required: [source, unreal, origin]
          properties:
            source: { type: string }
            unreal: { type: string }
            origin: { type: string }
        landscape: { $ref: "#/components/schemas/UnrealLandscape" }
        splines:
          type: array
          items: { $ref: "#/components/schemas/UnrealSpline" }
        proxyActors:
          type: array
          items: { $ref: "#/components/schemas/UnrealProxyActor" }
        hierarchicalInstances:
          type: array
          items: { $ref: "#/components/schemas/UnrealHierarchicalInstances" }
