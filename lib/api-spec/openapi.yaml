        distance3dMeters: { type: number }
        bearingDegrees: { type: number }
        verticalAngleDegrees: { type: number }
        uncertaintyMeters: { type: number, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ValidationSpec:
