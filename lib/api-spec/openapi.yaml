            rotationDegrees: { $ref: "#/components/schemas/UnrealRotation" }
            scale: { type: number }
        unrealCentimeters:
          type: object
          required: [location, rotationDegrees, scale]
          properties:
            location: { $ref: "#/components/schemas/UnrealVectorCentimeters" }
            rotationDegrees: { $ref: "#/components/schemas/UnrealRotation" }
            scale: { type: number }
    UnrealSplinePoint:
      type: object
      required: [index, sourceMeters, unrealCentimeters]
      properties:
        index: { type: number, minimum: 0 }
