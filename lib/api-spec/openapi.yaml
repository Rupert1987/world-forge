        unrealCentimeters: { $ref: "#/components/schemas/UnrealVectorCentimeters" }
    UnrealSpline:
      type: object
      required: [id, name, type, closed, widthMeters, source, points]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [coastline, road]
        closed: { type: boolean }
        widthMeters: { type: number, minimum: 0 }
        source: { type: string }
        points:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/UnrealSplinePoint" }
    UnrealLandscape:
      type: object
      required:
        [
          editable,
          actorClass,
          source,
          dimensionsMeters,
          dimensionsUnrealCentimeters,
          originMeters,
          originUnrealCentimeters,
          resolution,
          sampleSpacingMeters,
          sampleSpacingUnrealCentimeters,
          heightEncoding,
          heightSamplesMeters,
          heightmapR16Base64,
          importRecipe,
        ]
      properties:
        editable: { type: boolean }
        actorClass: { type: string }
        source: { type: string }
        dimensionsMeters: { type: object, additionalProperties: { type: number } }
        dimensionsUnrealCentimeters:
          type: object
          additionalProperties: { type: number }
        originMeters: { $ref: "#/components/schemas/UnrealVectorMeters" }
        originUnrealCentimeters:
          $ref: "#/components/schemas/UnrealVectorCentimeters"
        resolution:
          type: object
          required:
            [samplesX, samplesY, quadsX, quadsY, componentSizeQuads, componentsX, componentsY]
          properties:
            samplesX: { type: number, minimum: 2 }
            samplesY: { type: number, minimum: 2 }
            quadsX: { type: number, minimum: 1 }
            quadsY: { type: number, minimum: 1 }
            componentSizeQuads: { type: number, minimum: 1 }
            componentsX: { type: number, minimum: 1 }
            componentsY: { type: number, minimum: 1 }
        sampleSpacingMeters:
          type: object
          required: [x, y]
          properties:
            x: { type: number, exclusiveMinimum: 0 }
            y: { type: number, exclusiveMinimum: 0 }
        sampleSpacingUnrealCentimeters:
          type: object
          required: [x, y]
          properties:
            x: { type: number, exclusiveMinimum: 0 }
            y: { type: number, exclusiveMinimum: 0 }
        heightEncoding:
          type: object
          required:
            [values, importToUnreal, heightmapFilename, heightmapFormat, landscapeScaleZPercent]
          properties:
            values: { type: string }
            importToUnreal: { type: string }
            heightmapFilename: { type: string }
            heightmapFormat: { type: string }
            landscapeScaleZPercent: { type: number, exclusiveMinimum: 0 }
        heightSamplesMeters:
          type: array
          minItems: 4
          items: { type: number }
        heightmapR16Base64: { type: string }
        importRecipe:
          type: object
          required:
            [
              target,
              heightmapFilename,
              resolution,
              sectionSizeQuads,
              sectionsPerComponent,
              components,
              locationUnrealCentimeters,
              scale,
              steps,
            ]
          properties:
            target: { type: string }
            heightmapFilename: { type: string }
            resolution: { type: string }
            sectionSizeQuads: { type: number, minimum: 1 }
            sectionsPerComponent: { type: number, minimum: 1 }
            components: { type: string }
            locationUnrealCentimeters:
              $ref: "#/components/schemas/UnrealVectorCentimeters"
            scale:
              type: object
              required: [xCentimetersPerQuad, yCentimetersPerQuad, zPercent]
              properties:
                xCentimetersPerQuad: { type: number, exclusiveMinimum: 0 }
                yCentimetersPerQuad: { type: number, exclusiveMinimum: 0 }
                zPercent: { type: number, exclusiveMinimum: 0 }
            steps:
              type: array
              minItems: 1
              items: { type: string }
    UnrealProxyActor:
