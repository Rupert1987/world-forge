        unlinkedLandmarkCount: { type: number, minimum: 0 }
        missingSurveyObjectCount: { type: number, minimum: 0 }
        invalidGeometryCount: { type: number, minimum: 0 }
        duplicateIdCount: { type: number, minimum: 0 }
