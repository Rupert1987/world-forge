            $ref: "#/components/schemas/SurveyDepthBand"
        objects:
          type: array
          items:
            $ref: "#/components/schemas/SurveyObject"
        terrainContours:
          type: array
          items:
            $ref: "#/components/schemas/SurveyContour"
        waterlines:
          type: array
          items:
            $ref: "#/components/schemas/SurveyWaterline"
        lightAndAtmosphere:
          type: array
          items:
            $ref: "#/components/schemas/SurveyLightSignal"
        ambiguities:
          type: array
          items: { type: string }
        coverageChecklist:
          $ref: "#/components/schemas/SurveyCoverageChecklist"
