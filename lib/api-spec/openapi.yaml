        reason: { type: string }
        uncertaintyMeters: { type: number, minimum: 0, nullable: true }
        sourceMeters:
          type: object
          required: [location, rotationDegrees, scale]
          properties:
            location: { $ref: "#/components/schemas/UnrealVectorMeters" }
            rotationDegrees: { $ref: "#/components/schemas/UnrealRotation" }
            scale: { type: number }
        unrealCentimeters:
          type: object
          required: [location, rotationDegrees, scale]
          properties:
            location: { $ref: "#/components/schemas/UnrealVectorCentimeters" }
            rotationDegrees: { $ref: "#/components/schemas/UnrealRotation" }
            scale: { type: number }
    UnrealHierarchicalInstances:
      type: object
      required:
        [id, label, sourceAssetId, sourceAssetName, meshSlots, reusable, productionCount, declaredPlacementCount, exportedTransformCount, remainingProceduralCount, replacementPath, fallbackMeshPath, transforms]
      properties:
        id: { type: string }
        label: { type: string }
        sourceAssetId: { type: string }
        sourceAssetName: { type: string }
        meshSlots: { type: number, minimum: 1 }
        reusable: { type: boolean }
        productionCount: { type: number, minimum: 1 }
        declaredPlacementCount: { type: number, minimum: 1 }
        exportedTransformCount: { type: number, minimum: 0 }
        remainingProceduralCount: { type: number, minimum: 0 }
        replacementPath: { type: string }
        fallbackMeshPath: { type: string }
        dimensionsMeters:
          $ref: "#/components/schemas/AssetDimensionsMeters"
        placementPattern:
